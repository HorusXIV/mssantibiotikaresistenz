stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: .uv-cache

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR

.uv-setup:
  before_script:
    - uv sync --frozen

# =============================================================================
# Lint Stage
# =============================================================================

ruff:
  stage: lint
  extends: .uv-setup
  script:
    - uv run ruff check .
  allow_failure: false

black:
  stage: lint
  extends: .uv-setup
  script:
    - uv run black --check .
  allow_failure: false

# =============================================================================
# Test Stage
# =============================================================================

test:
  stage: test
  extends: .uv-setup
  script:
    - uv run pytest tests/ --ignore=tests/integration_tests -v --tb=short
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week
  rules:
    - when: always

integration-tests:
  stage: test
  extends: .uv-setup
  script:
    - uv run pytest tests/integration_tests/ -v --tb=short
  allow_failure: false
