# =============================================================================
# Phase 2 — Sweep: population.carrier_template.sociability
# =============================================================================
#
# Was wird kalibriert?
#   Kontaktraten-Multiplikator fuer Carrier-Patienten.
#   Hoehere Werte → Carrier machen mehr Kontakte → mehr Transmissionen.
#   transmission_multiplier = sociability × relative_transmissibility (micro)
#
# Zielgroesse: acquisition_rate_per_1000
#   Neuinfektionen pro 1000 Patienten-Tage.
#   Zielwert 1.5 (Swissnoso 2022 / ECDC EARS-Net 2023).
#
# Kalibrierungsreihenfolge: Phase 2d (nach suszeptibler Seite)
#   Carrier-sociability bestimmt die Angebotsseite der Transmission,
#   suszeptible Parameter die Nachfrageseite. Deshalb erst suszeptible
#   Seite kalibrieren.
# =============================================================================

run_days_override: 90

parameter:
  section: population.carrier_template
  name: sociability
  min: 0.40
  max: 2.00
  n_steps: 9

target:
  metric: acquisition_rate_per_1000
  value: 1.5
  label: "Swissnoso 2022 / ECDC EARS-Net 2023"

n_seeds: 5

use_micro: false
