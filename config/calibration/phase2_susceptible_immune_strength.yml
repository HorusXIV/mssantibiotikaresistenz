# =============================================================================
# Phase 2 — Sweep: population.susceptible_template.immune_strength
# =============================================================================
#
# Was wird kalibriert?
#   Immunkraft-Multiplikator suszeptibler Patienten.
#   Wirkt als Nenner auf die Suszeptibilitaet:
#     susceptibility_multiplier = vulnerability / immune_strength
#   Hoehere Werte → resistenter gegen Kolonisierung → geringere Akquisitionsrate.
#
# Zielgroesse: acquisition_rate_per_1000
#   Neuinfektionen pro 1000 Patienten-Tage.
#   Zielwert 1.5 (Swissnoso 2022 / ECDC EARS-Net 2023).
#
# Kalibrierungsreihenfolge: Phase 2b (nach sociability)
#   immune_strength und vulnerability sind teilweise konfundiert.
#   Deshalb: erst sociability fixieren, dann immune_strength, dann vulnerability.
# =============================================================================

run_days_override: 90

parameter:
  section: population.susceptible_template
  name: immune_strength
  min: 0.30
  max: 2.00
  n_steps: 8

target:
  metric: acquisition_rate_per_1000
  value: 1.5
  label: "Swissnoso 2022 / ECDC EARS-Net 2023"

n_seeds: 5

use_micro: false
