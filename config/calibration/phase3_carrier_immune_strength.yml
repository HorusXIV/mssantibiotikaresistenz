# =============================================================================
# Phase 2 — Sweep: population.carrier_template.immune_strength
# =============================================================================
#
# Was wird kalibriert?
#   Immunkraft-Multiplikator von Carrier-Patienten.
#   Beeinflusst p_clearance: starkeres Immunsystem → schnellere Clearance
#   → geringere mittlere Praevalenz.
#
# Zielgroesse: mean_prevalence
#   Mittlerer Carrier-Anteil im stationaeren Zustand.
#   Literatur: MRSA-Praevalenz in Schweizer Akutspitaelern ca. 1.5–4 %
#   (Swissnoso 2022). Zielwert 0.02.
#
# Kalibrierungsreihenfolge: Phase 2e
#   Carrier immune_strength → Clearance-Dynamik → Praevalenz.
# =============================================================================

run_days_override: 90

parameter:
  section: population.carrier_template
  name: immune_strength
  min: 0.30
  max: 1.80
  n_steps: 8
  # min: 1.8
  # max: 2.2
  # n_steps: 3
target:
  metric: mean_prevalence
  value: 0.02
  label: "Swissnoso 2022 (1.5–4 % MRSA-Praevalenz CH)"

n_seeds: 5

use_micro: false
