# =============================================================================
# Phase 3 — Sweep: macro.transmission_mutation_probability
# =============================================================================
#
# Was wird kalibriert?
#   Wahrscheinlichkeit, dass bei einer Uebertragung eine Mutation im
#   transmittierten Genom auftritt (Makro-Ebene, vor Micro-Initialisierung).
#   Hoehere Werte → mehr Varianz in uebertragenen Staemmen → schnellere
#   Resistenzentwicklung auf Populations-Ebene.
#
# Zielgroesse: mean_resistant_fraction
#   Mittlerer Anteil resistenter Bakterien ueber alle Carrier im
#   stationaeren Zustand (letztes Drittel).
#   Literatur: MRSA resistant_fraction (mecA-basiert) ca. 5–10 %
#   des Gesamtgenoms als Initialwert → 0.073 aus Swissnoso-Daten
#   (analog zu carrier_template.resistant_fraction in der Config).
#
# HINWEIS: Phase 3 braucht laengere Laeufe (Resistenzevolution ist langsam).
#   Kein run_days_override → verwendet run.days aus simulation_realistic.yml (365).
#   Voraussetzung: Micro-Parameter grob kalibriert.
#
# Kalibrierungsreihenfolge: Phase 3a (zuerst Mutationswahrscheinlichkeit)
# =============================================================================

# kein run_days_override: 365 Tage fuer Resistenzevolution noetig

parameter:
  section: macro
  name: transmission_mutation_probability
  min: 0.00
  max: 0.60
  n_steps: 7

target:
  metric: mean_resistant_fraction
  value: 0.073
  label: "Swissnoso 2022 (mecA-Resistenzanteil ~7.3 % bei MRSA-Carriern)"

n_seeds: 5
