# =============================================================================
# Phase 2 — Sweep: population.susceptible_template.sociability
# =============================================================================
#
# Was wird kalibriert?
#   Kontaktraten-Multiplikator fuer suszeptible Patienten.
#   sociability = 1.0 entspricht mittlerer Kontakthaeufigkeit.
#   Hoehere Werte → mehr Kontakte → hoehere Akquisitionsrate.
#
# Zielgroesse: acquisition_rate_per_1000
#   Neuinfektionen pro 1000 Patienten-Tage.
#   Zielwert 1.5 (Swissnoso 2022 / ECDC EARS-Net 2023).
#
# Kalibrierungsreihenfolge: Phase 2a
#   Kalibriere sociability VOR vulnerability/immune_strength, da sociability
#   den Transmissionspfad direkt skaliert (base_transfer_rate × sociability).
#   Haelt vulnerability=1.1 und immune_strength=0.9 auf Schaetzwert.
# =============================================================================

run_days_override: 90

parameter:
  section: population.susceptible_template
  name: sociability
  min: 0.40
  max: 2.00
  n_steps: 9

target:
  metric: acquisition_rate_per_1000
  value: 1.5
  label: "Swissnoso 2022 / ECDC EARS-Net 2023"

n_seeds: 5

use_micro: false
