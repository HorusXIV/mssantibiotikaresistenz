# cal_micro_single_patient.yml
#
# Konfiguration fuer die Einzelpatienten-Mikrosimulation.
# Simuliert einen einzigen Carrier-Patienten ueber die volle Episodendauer
# und visualisiert die within-host Populationsdynamik detailliert.

# ===========================================================================
# EPISODEN-KONFIGURATION
# ===========================================================================
episode:
  n_days: 10000 # Reduziert auf ca. 4 Jahre (vorher 20 Jahre - nicht glaubwuerdig)
  seed: 42 # Seed gewaehlt fuer anschauliche Evolutions-Dynamik
  resistant_fraction: 0.0 # Start ohne Resistenz (Evolutions-Fokus)
  dominant_genotype: R1
  initial_population: 1.0e6
  immune_strength: 0.70 # Moderat geschwaechtes Immunsystem (typisch fuer Carrier)
  allow_spontaneous_clearance: false

  abx_schedule:
    - start_day: 50
      end_day: 64
      abx_class: glycopeptide
      dose_level: low
      adherence: 0.6
    - start_day: 120
      end_day: 130
      abx_class: beta_lactam
      dose_level: medium
      adherence: 0.70
    - start_day: 180
      end_day: 190
      abx_class: beta_lactam
      dose_level: high
      adherence: 0.85
    - start_day: 240
      end_day: 250
      abx_class: beta_lactam
      dose_level: high
      adherence: 1.0
    - start_day: 300
      end_day: 307
      abx_class: tetracycline
      dose_level: high
      adherence: 1.0

# ===========================================================================
# MIKRO-BLOCK: Kalibrierte Parameter fuer Evolution und Persistenz
# ===========================================================================
micro:
  workers: null
  founder_pool_size: 32
  founder_pool_seed: 1
  founder_pool_gene_noise_std: 0.02
  gene_presence_threshold: 0.2

  steps_per_day: 12
  max_strains: 50
  carrying_capacity: 500000000.0
  min_population: 200.0
  clearance_threshold: 2000.0

  base_mutation_rate: 0.015 # Erhoeht fuer sichtbare Evolution
  mutation_std: 0.05 # Erlaubt groessere Evolutions-Spruenge
  stress_mutation_boost: 50.0 # SOS-Antwort unter ABX
  mutant_transfer_fraction: 0.05

  base_hgt_rate: 0.04
  hgt_gene_transfer_prob: 0.3

  selection_strength: 1.8
  abx_selection_pressure_multiplier: 5.0
  antibiotic_kill_scale: 0.15
  death_fitness_floor: 1.0 # Erhoeht fuer stabilere Populationsdynamik
  growth_rate_per_step: 0.22
  death_rate_per_step: 0.04
  strain_prune_threshold: 300.0

  base_damage_per_step: 0.005
  replication_damage_factor: 0.04
  stress_damage_factor: 0.08
  repair_rate_per_step: 0.07
  age_mortality_scale: 0.002
  damage_mortality_scale: 0.03
  lifecycle_half_life_steps: 150.0
  max_damage_load: 4.0
  dormancy_growth_penalty: 0.6
  synergy_repair_dormancy_bonus: 0.3
  synergy_stress_tolerance_bonus: 0.25

  stochastic_threshold: 20000.0
  stochastic_noise_scale: 0.1
