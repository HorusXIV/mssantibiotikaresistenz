# =============================================================================
# Phase 1 — Sweep: macro.base_isolation_effectiveness
# =============================================================================
#
# Was wird kalibriert?
#   Wirkungsgrad der Isolation: Anteil der Transmissions-Wahrscheinlichkeit,
#   die durch Isolation verhindert wird (0 = keine Wirkung, 1 = perfekte Isolation).
#
# Zielgroesse: acquisition_rate_per_1000
#   Neuinfektionen pro 1000 Patienten-Tage im stationären Zustand.
#
#   Hintergrund:
#   - ECDC EARS-Net 2023 berichtet MRSA vor allem als Blutstrominfektionen
#     pro 100 000 Einwohner bzw. als Anteil MRSA an invasiven S.-aureus-Isolaten,
#     nicht als Akquisitionsrate pro 1000 Patienten-Tage.
#     Quelle: ECDC, Antimicrobial resistance in the EU/EEA (EARS-Net)
#     https://www.ecdc.europa.eu/en/publications-data/antimicrobial-resistance-eueea-ears-net-annual-epidemiological-report-2023 [web:68]
#   - Swissnoso/Schweizer AMR-Berichte zeigen ein Niedrig-MRSA-Setting
#     (tiefe MRSA-BSI-Inzidenz und niedriger MRSA-Anteil), aber ebenfalls
#     keine direkte MRSA-Akquisitionsrate pro 1000 Patienten-Tage.
#     Beispiel: Swissnoso Annual Report / Swiss Antibiotic Resistance Report
#     https://www.swissnoso.ch/fileadmin/swissnoso/Dokumente/6_Guidelines_Publikationen_ab_Maerz_2023/230912_Swissnoso_Annual_Report_HAI_CH_2022.pdf [web:76]
#     https://www.newsd.admin.ch/newsd/message/attachments/90531.pdf [web:77]
#
#   Modellannahme:
#   Für ein Schweizer Niedrig-MRSA-Setting verwenden wir deshalb einen
#   plausiblen Zielbereich von ca. 0.5–2.0 MRSA-Akquisitionen pro 1000
#   Patienten-Tage als Szenarienkorridor. Der Punktzielwert 1.5 liegt in
#   der Mitte dieses Bereichs und dient als Kalibrationsziel, ist aber
#   kein direkt publizierter Literaturwert.
#
# Warum kein Micro-Einfluss?
#   run_days_override: 90 begrenzt die Laufzeit auf 90 Tage. In diesem Fenster
#   ist Resistenzevolution minimal — Micro-Ausgaben (relative_transmissibility,
#   p_clearance) ändern sich kaum. Dadurch wird das Makro-Signal isoliert.
#
# Kalibrierungsreihenfolge: ZUERST (minimale Abhängigkeit von anderen Parametern)
# =============================================================================

run_days_override: 90          # kurze Läufe → micro-isoliert, schneller

parameter:
  section: macro
  name: base_isolation_effectiveness
  # min: 0.40
  # max: 0.95
  min: 0.95
  max: 1
  n_steps: 8                   # [0.40, 0.49, 0.57, 0.66, 0.74, 0.83, 0.91, 0.95]

target:
  metric: acquisition_rate_per_1000
  value: 1.5
  label: "Modellannahme für Schweizer Niedrig-MRSA-Setting (plausibler Bereich 0.5–2.0/1000 Pat.-Tage; abgeleitet aus Swissnoso/EARS-Net Kontextdaten)"

n_seeds: 5
use_micro: false
