# =============================================================================
# Phase 1 — Sweep: macro.proximity_decay_alpha
# =============================================================================
#
# Was wird kalibriert?
#   Raeumlicher Abklingexponent der Transmissionswahrscheinlichkeit.
#   Hoehere Werte → Transmission faellt schneller mit Distanz (z.B. auf dem Grid).
#   Entspricht einem exponentiellen Distanzmodell: p_trans ∝ exp(-alpha * d)
#
# Zielgroesse: mean_prevalence
#   Mittlerer Carrier-Anteil im stationaeren Zustand (letztes Drittel).
#   Literatur: MRSA-Praevalenz in Schweizer Akutspitaelern ca. 1.5–4 %
#   (Swissnoso Surveillance 2022; Rohner et al. 2017, Swiss Med Wkly).
#   Zielwert 0.02 (2 %) als untere Grenze des plausiblen Bereichs.
#
# Kalibrierungsreihenfolge: Phase 1 (nach base_isolation_effectiveness)
#   Raeumliche Ausbreitung ist relativ unabhaengig von Host-Parametern.
# =============================================================================

run_days_override: 90

parameter:
  section: macro
  name: proximity_decay_alpha
  min: 0.10
  max: 2.50
  n_steps: 8

target:
  metric: mean_prevalence
  value: 0.02
  label: "Swissnoso 2022 / Rohner et al. 2017 (1.5–4 % MRSA-Praevalenz CH)"

n_seeds: 5

use_micro: false
