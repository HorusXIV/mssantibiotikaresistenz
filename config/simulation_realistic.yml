# config_realistic.yml

run:
  days: 365
  seed: 42
  run_id: realistic_run
  quiet: false

population:
  hospitals: 6

  # Geschätzt: ~2% der Patienten Carrier
  susceptible_count: 980
  carrier_count: 20

  initial_department: ward

  susceptible_template:
    compliance: 0.75        # -> adherence wird täglich daraus abgeleitet
    vulnerability: 1.1
    immune_strength: 0.9
    immune_status: normal
    sociability: 1.0

  carrier_template:
    compliance: 0.70        # -> adherence wird täglich daraus abgeleitet
    vulnerability: 1.3
    immune_strength: 0.75
    immune_status: normal
    sociability: 1.0
    resistant_fraction: 0.45
    dominant_genotype: R2
    relative_transmissibility: 1.2
    p_clearance: 0.0039 #DONE
    severity_modifier: 1.2
    lethality_modifier: 1.1

macro:
  # Grid
  dept_grid_cols: 3
  dept_grid_rows: 2
  dept_grid_icu_rows: 1
  network_grid_cols: 3


  # Geschätzt
  daily_contact_attempts: 12.0
  # Geschätzt ohne Recherche
  base_hygiene: 0.75
  # Kalibriert
  base_transmission_rate: 0.09


  # SCHÄTZBAR

  # LOS
  los_mean_ward: 5.0 # DONE
  los_mean_icu: 2.8 # DONE
  los_sigma: 0.6 # Vorerst nicht

  icu_abx_probability: 0.62 # DONE
  ward_abx_probability: 0.326 # DONE

  daily_admission_rate: 126.0

  community_carrier_fraction: 0.017 #DONE

  carrier_extension_days: 12.0 # DONE

  max_occupancy_per_hospital: 200

  daily_transfer_rate: 0.004 # DONE

  # base_carrier_mortality_rate: 0.002

  replacement_resistant_fraction: 0.2 #
  replacement_dominant_genotype: "S"


  # KALIBRIERBAR

  carrier_isolation_probability: 0.65

  base_isolation_effectiveness: 0.65

  proximity_decay_alpha: 0.5

  # Discharge
  discharge_logistic_k: 1.0
  discharge_logistic_t_half: 3.0

  transmission_mutation_probability: 0.25
  transmission_resistance_mutation_std: 0.08

  # Vorerst nicht kalibrieren
  base_diagnostic_speed: 1.0



micro:
  workers: null
  founder_pool_size: 32
  founder_pool_seed: 1
  founder_pool_gene_noise_std: 0.02
  gene_presence_threshold: 0.2
  steps_per_day: 12
  max_strains: 40
  carrying_capacity: 500000000.0

  # Lower: small resistant subpopulations survive longer before stochastic loss
  min_population: 100.0

  # Lower: resistant minority strains are not wiped by pruning
  clearance_threshold: 1000.0

  # Higher mutation rate: resistance emerges de novo within episodes under ABX pressure.
  # S. aureus SOS response: effective rate = base * stress_boost.
  # Target: meaningful resistance emergence within 14-30 days of ABX exposure.
  base_mutation_rate: 0.012
  mutation_std: 0.025

  # 40x SOS boost (literature range 10-100x; 40x gives de novo emergence on realistic timescale)
  stress_mutation_boost: 40.0

  # Moderate HGT: plasmid-mediated transfer within host is possible but not dominant
  base_hgt_rate: 0.03
  hgt_gene_transfer_prob: 0.25

  # Strong selection ensures resistant strains sweep within days under ABX
  selection_strength: 2.5

  growth_rate_per_step: 0.18
  death_rate_per_step: 0.06

  # Low prune threshold keeps resistant minority at 0.04% of population alive
  strain_prune_threshold: 200.0

  base_damage_per_step: 0.004
  replication_damage_factor: 0.03
  stress_damage_factor: 0.06
  repair_rate_per_step: 0.08

  age_mortality_scale: 0.001
  damage_mortality_scale: 0.025
  lifecycle_half_life_steps: 200.0
  max_damage_load: 5.0

  dormancy_growth_penalty: 0.55
  synergy_repair_dormancy_bonus: 0.25
  synergy_stress_tolerance_bonus: 0.20

  stochastic_threshold: 10000.0
  stochastic_noise_scale: 0.08
