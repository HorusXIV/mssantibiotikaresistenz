# config_realistic.yml

run:
  days: 365
  seed: 4
  run_id: realistic_run
  quiet: false
  use_micro: true                 # Mikro-Layer (Within-Host-Evolution) [true/false]; false = nur Makro, Carrier behalten Template-Defaults

population:
  hospitals: 6                    # Anzahl Spitäler im Netzwerk [Stück]

  # Geschätzt: ~2% der Patienten Carrier
  susceptible_count: 980          # Startpopulation Susceptible [Patienten] -> zusammen 1000, 2% Carrier-Anteil
  carrier_count: 20               # Startpopulation Carrier [Patienten]

  initial_department: ward        # Kategorie: ward | icu

  susceptible_template:
    compliance: 0.80              # Verhaltens-Compliance [0–1] -> skaliert Antibiotikawirkung via adherence im Mikro-Layer
    immune_strength: 1.0          # Immunkompetenz-Multiplikator [Referenz = 1.0] -> Makro-Suszeptibilität (1/immune_strength) + Mikro-Clearance
    sociability: 1.0              # Kontaktintensitäts-Multiplikator [Referenz = 1.0] -> skaliert base_transmission_rate

  carrier_template:
    compliance: 0.80              # Verhaltens-Compliance [0–1] -> identisch zu Susceptible; wirkt via adherence im Mikro
    immune_strength: 1.0          # Immunkompetenz-Multiplikator [Referenz = 1.0] -> identisch zu Susceptible; wirkt im Mikro auf Immun-Clearance
    sociability: 1.0              # Kontaktintensitäts-Multiplikator [Referenz = 1.0] -> skaliert base_transmission_rate
    resistant_fraction: 0.90      # Anteil MRSA an Gesamt-S.aureus innerhalb des Carriers [0–1]
    dominant_genotype: R2         # Resistenzklasse [S | R1 | R2 | R3]
    relative_transmissibility: 1  # Übertragungs-Multiplikator [Referenz = 1.0] -> Initialwert für Tag 1; danach täglich vom Mikro aktualisiert
    p_clearance: 0.0039           # Spontane Dekolonisierungswahrscheinlichkeit [Wahrscheinlichkeit / Patient*Tag]
    severity_modifier: 1.2        # Schweregard-Multiplikator [Referenz = 1.0] -> skaliert carrier_extension_days und base_mortality_rate

macro:
  # --- Räumliches Gitter ---
  dept_grid_cols: 5               # Spalten im Abteilungsgitter [Gitterzellen] -> 5×4 = 20 Positionen pro Spital
  dept_grid_rows: 4               # Reihen im Abteilungsgitter [Gitterzellen]
  dept_grid_icu_rows: 1           # ICU-Reihen [Gitterzellen] -> 1/4 = 25% ICU-Anteil
  network_grid_cols: 3            # Spalten im Spitalnetzwerk [Gitterzellen] -> 3×2-Raster für 6 Spitäler

  # --- Transmission ---
  daily_contact_attempts: 14.0    # Relevante Kontaktepisoden [Kontakte / Patient*Tag]
  base_hygiene: 0.75              # Hygieneeffektivität [0–1] -> Reduktionsfaktor auf den Gesamt-Hazard: wirksamer Anteil = 1−0.75 = 0.25
  base_transmission_rate: 0.07    # Kolonisierungswahrscheinlichkeit [Wahrscheinlichkeit / Kontakt*Carrier] -> kalibriert (β₀)

  # --- Verweildauer (Log-Normal-Verteilung) ---
  los_mean_ward: 5.0              # Mittlere Aufenthaltsdauer Normalstation [Tage]
  los_mean_icu: 2.8               # Mittlere Aufenthaltsdauer Intensivstation [Tage]
  los_sigma: 0.6                  # Log-Normal-Formparameter [–] -> bestimmt Streuungsbreite der LOS-Verteilung; typisch 0.4–0.8

  # --- Antibiotikaverordnung ---
  icu_abx_probability: 0.62       # Antibiotikaverordnungs-Wahrscheinlichkeit ICU [Wahrscheinlichkeit / Patient*Tag]
  ward_abx_probability: 0.326     # Antibiotikaverordnungs-Wahrscheinlichkeit Normalstation [Wahrscheinlichkeit / Patient*Tag]

  # --- Antibiotika-Dosis ---
  abx_distribution: true          # true = behandelte Patienten ziehen low/std/high gleichverteilt (gemischte Station)
  # abx_dosage: high              # nur bei abx_distribution=false: feste Dosis für ALLE Behandelten [low | std | high]
  abx_course_length_days: 14      # Behandlungskurs in Tagen; 0 = tägliche Zufallsziehung (altes Verhalten)

  # --- Patientenfluss ---
  daily_admission_rate: 126.0           # Neuaufnahmen [Patienten / Tag] -> ≈ 21/Spital*Tag; bei LOS 5 Tage: Steady-State ≈ 105/Spital
  community_carrier_fraction: 0.017     # Anteil MRSA-positiver Neuaufnahmen aus der Gemeinschaft [0–1]
  max_occupancy_per_hospital: 200       # Kapazitätsgrenze [Patienten / Spital]
  daily_transfer_rate: 0.004            # Verlegungswahrscheinlichkeit [Wahrscheinlichkeit / Patient*Tag]

  # --- Entlassung & Mortalität ---
  carrier_extension_days: 12.0    # Aufenthaltsverlängerung bei MRSA-Erkennung [Tage] -> × severity_modifier im Discharge-Loop
  base_mortality_rate: 0.0045     # Tägliche Sterblichkeit [Wahrscheinlichkeit / Patient*Tag]
                                  # -> für Carrier: × severity_modifier = 0.0045×1.2 = 0.0054/Tag
  discharge_logistic_k: 1.0       # Steilheit der logistischen Entlassungskurve [1/Tag]
  discharge_logistic_t_half: 3.0  # Halbwert nach geplantem Entlassungstag [Tage] -> nach 3 Tagen: 50% Entlassungswahrsch.

  # --- Community-Carrier bei Aufnahme ---
  replacement_resistant_fraction: 0.90  # Anteil MRSA an Gesamt-S.aureus bei neu eintretenden Community-Carriern [0–1]
  replacement_dominant_genotype: "R2"  # Resistenzklasse neu eintretender Community-Carrier [S | R1 | R2 | R3]

  # --- Isolation & Diagnostik ---
  carrier_isolation_probability: 0.65   # Erkennungs- und Isolationswahrscheinlichkeit [Wahrscheinlichkeit / nicht-isoliertem Carrier*Tag]
  base_isolation_effectiveness: 0.45    # Transmissionsreduktion für isolierte Patienten [0–1] -> kalibriert (Kalibrierung 3, bester Gitterpunkt)
  base_diagnostic_speed: 1.0            # Diagnostik-Geschwindigkeit [Multiplikator, Referenz = 1.0]
                                        # -> 0.5 = halbierte Erkennungsrate (Kultur), 2.0 = doppelte Rate (PCR)

  # --- Räumlicher Zerfall ---
  proximity_decay_alpha: 1.05     # Zerfallskoeffizient [1/Gitterzelle] in w = exp(−α*d) -> kalibriert
                                  # -> Nachbar (d=1): 0.35, zwei Zellen (d=2): 0.12


micro:
  # --- Ausführung (technisch) ---
  workers: null                       # Worker-Prozesse [Anzahl; null = CPU-Anzahl]
  founder_pool_size: 32               # Grösse der Gründerstamm-Bibliothek [Anzahl Stämme; 0 = deaktiviert]
  founder_pool_seed: 1                # Seed der Gründer-Erzeugung [technisch, Reproduzierbarkeit]
  founder_pool_gene_noise_std: 0.02   # Rauschen um Archetyp-Genome [Genwert-SD, 0–1]
  gene_presence_threshold: 0.2        # Schwelle "Gen vorhanden" in Rohlogs [Genwert, 0–1]

  # --- Zeit & Populationsgrenzen ---
  steps_per_day: 12                   # Mikro-Zeitschritte im nächtlichen 12h-Aktivfenster [Schritte / Makro-Tag] -> 1h/Schritt
  max_strains: 40                     # Maximale aktive Stämme pro Episode [Anzahl]
  carrying_capacity: 500000000.0      # Obergrenze der Within-Host-Population [Bakterien / Patient]
  min_population: 100.0               # Extinktions-Untergrenze [Bakterien / Patient] -> darunter sichere Klärung
  clearance_threshold: 1000.0         # Schwelle fast sicherer Klärung [Bakterien / Patient]

  # --- Mutation ---
  base_mutation_rate: 0.012           # Basis-Mutationsrate [Mutationen / Gen*Schritt] -> 0 deaktiviert Mutation
  mutation_std: 0.025                 # SD einer Trait-Mutation [Genwert-Delta, 0–1]
  stress_mutation_boost: 40.0         # Mutationsboost unter ABX-Stress [Multiplikator; SOS, Lit. 10–100x]
  mutant_transfer_fraction: 0.03      # Populationsanteil pro Mutation, der in den neuen Mutantenstamm überführt wird [Anteil/Mutation]

  # --- Horizontaler Gentransfer ---
  base_hgt_rate: 0.03                 # Basis-HGT-Wahrscheinlichkeit [Wahrscheinlichkeit / Stamm*Schritt] -> 0 deaktiviert HGT
  hgt_gene_transfer_prob: 0.25        # Genübertragung pro HGT-Ereignis [Wahrscheinlichkeit / transferierbares Gen]

  # --- Selektion & Wachstum ---
  selection_strength: 2.5             # Basis-Exponent auf relative Fitness ohne ABX [dimensionslos; 0 = neutrale Selektion]
  abx_selection_pressure_multiplier: 3.0  # verstärkt selection_strength unter ABX-Druck [dimensionslos]
  antibiotic_kill_scale: 0.08       # explizite ABX-Killrate pro Schritt, skaliert mit 1 - abx_survival [Anteil/Schritt]
  growth_rate_per_step: 0.18          # Basis-Wachstumsrate [Anteil / Schritt]
  death_rate_per_step: 0.06           # Basis-Sterberate [Anteil / Schritt]
  death_fitness_floor: 0.1          # Fitness-Floor im Sterbeterm [dimensionslos]
  strain_prune_threshold: 200.0       # Pruning-Untergrenze [Bakterien (absolut)]

  # --- Schaden, Lebenszyklus & Dormanz ---
  base_damage_per_step: 0.004         # Hintergrundschaden [Schadenseinheiten / Schritt]
  replication_damage_factor: 0.03     # Zusatzschaden aus Replikationsdruck [Schaden / Schritt-Einheit]
  stress_damage_factor: 0.06          # Zusatzschaden aus Umweltstress [Schaden / Schritt-Einheit]
  repair_rate_per_step: 0.08          # Reparaturkapazität [Schadensabbau / Schritt]
  age_mortality_scale: 0.001          # Gewicht des Linienalters auf Turnover [pro Schritt-Einheit]
  damage_mortality_scale: 0.025       # Gewicht der Schadenslast auf Turnover [dimensionslos]
  lifecycle_half_life_steps: 200.0    # Zeitskala des Alterungsdrucks [Schritte]
  max_damage_load: 5.0                # Sättigung der Schadenslast [Schadenseinheiten]
  dormancy_growth_penalty: 0.55       # Wachstumsreduktion bei Dormanz [Anteil, 0–1]
  synergy_repair_dormancy_bonus: 0.25 # Bonus Reparatur x Dormanz [dimensionslos]
  synergy_stress_tolerance_bonus: 0.20  # Bonus Stress x Toleranz [dimensionslos]

  # --- Demografische Stochastik ---
  stochastic_threshold: 10000.0       # Schwelle Poisson vs. Normalrauschen [Bakterien (absolut)]
  stochastic_noise_scale: 0.08        # Rauschstärke oberhalb der Schwelle [dimensionslos]
