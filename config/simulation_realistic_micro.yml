# config_realistic_micro.yml
#
# ZWECK
# -----
# Kopie von `simulation_realistic.yml` mit einem stärker an Literatur/Surveillance
# verankerten MIKRO-Block. Der Makro-Block ist identisch zu `simulation_realistic.yml`
# (vom Mitautor kalibriert) und wird hier NICHT verändert.
#
# Hintergrund: Im produktiven Lauf (`simulation_realistic.yml`) kollabiert der
# within-host `resistant_fraction` ohne Antibiotikadruck binnen ~5 Tagen von 0.90
# auf nahezu 0 (siehe `logs/MSS_Simulation_relaistic-6143.out`, avg_resistant_fraction
# fällt von 0.30 auf ~0.001). Real persistiert MRSA-Trägerschaft jedoch Monate
# (Median ~7.4–8.5 Monate spontane Clearance; Systematic Review 16 Studien ~88 Wochen).
# Diese Datei verschiebt die Mikro-Parameter in Richtung der recherchierten Zielgrössen
# und markiert die verbleibenden code-seitigen Stellhebel als Kalibrierungsziele.
#
# WICHTIG (Abgrenzung): Die dominante Ursache des Resistenz-Washouts (Fitness-Gap
# S vs. R2 von ~0.78 vs. ~0.56 pro Schritt) sitzt in `genome.py`-Konstanten
# (ResistanceCosts, GROWTH_BASE der Seed-Genome) und im fitness-inversen Death-Term
# in `engine.py::selection_step`. Diese sind NICHT über die YAML erreichbar. Diese
# Config mildert das Problem über die erreichbaren Schalter (Selektion, Wachstum/Tod,
# Mutation/HGT-Zeitskala); die vollständige Korrektur erfordert eine kleine
# Code-Kalibrierung (siehe config/calibration/cal5_micro_resistance_persistence.yml
# und config/02_Mikro_Parameterübersicht.md, Abschnitt "Code-seitige Kalibrierung").
#
# TYP-LEGENDE (wie in 02_Mikro_Parameterübersicht.md):
#   geschätzt  = Literatur/Surveillance liefert Zielgrösse oder Grössenordnung
#   kalibrieren = effektiver Modellparameter; Literatur nur Richtung/Grössenordnung
#   technisch   = numerisch/architektonisch
#   Modellannahme = bewusste Strukturannahme des komprimierten Trait-Modells

run:
  days: 365
  seed: 4
  run_id: realistic_micro_run
  quiet: false
  use_micro: true

population:
  hospitals: 6
  susceptible_count: 980
  carrier_count: 20
  initial_department: ward

  susceptible_template:
    compliance: 0.80
    immune_strength: 1.0
    sociability: 1.0

  carrier_template:
    compliance: 0.70
    immune_strength: 0.75
    resistant_fraction: 0.90
    dominant_genotype: R1
    relative_transmissibility: 1
    p_clearance: 0.0039
    severity_modifier: 1.2

# ===========================================================================
# MAKRO-BLOCK:
# ===========================================================================
macro:
  dept_grid_cols: 5
  dept_grid_rows: 4
  dept_grid_icu_rows: 1
  network_grid_cols: 3

  daily_contact_attempts: 14.0
  base_hygiene: 0.75
  base_transmission_rate: 0.07

  los_mean_ward: 5.0
  los_mean_icu: 2.8
  los_sigma: 0.6

  icu_abx_probability: 0.62
  ward_abx_probability: 0.326

  daily_admission_rate: 126.0
  community_carrier_fraction: 0.017
  max_occupancy_per_hospital: 200
  daily_transfer_rate: 0.004

  carrier_extension_days: 12.0
  base_mortality_rate: 0.0045
  discharge_logistic_k: 1.0
  discharge_logistic_t_half: 3.0

  replacement_resistant_fraction: 0.90
  replacement_dominant_genotype: "R1"

  carrier_isolation_probability: 0.65
  base_isolation_effectiveness: 0.45
  base_diagnostic_speed: 1.0

  proximity_decay_alpha: 1.05

# ===========================================================================
# MIKRO-BLOCK: an Literatur/Surveillance verankert (geänderte Werte annotiert)
# ===========================================================================
micro:
  # --- Ausführung (technisch) ---
  workers: null
  founder_pool_size: 32
  founder_pool_seed: 1
  founder_pool_gene_noise_std: 0.02
  gene_presence_threshold: 0.2

  # --- Zeit & Populationsgrenzen ---
  # steps_per_day = 12: ein Schritt = 1 reale Stunde im nächtlichen 12h-Aktivfenster.
  steps_per_day: 12 # technisch/geschätzt | ; Zeitanker 1h/Schritt
  max_strains: 40 # technisch |
  carrying_capacity: 500000000.0 # geschätzt | 5e8: nasale S.-aureus-Last bis ~1e6–1e8 CFU/Swab; Modellskala
  min_population: 100.0 # technisch / kalibrieren |
  clearance_threshold: 1000.0 # technisch / kalibrieren |

  # --- Mutation ---
  base_mutation_rate: 0.006 # geschätzt/kalibrieren | GEÄNDERT 0.012->0.006 (niedrige within-host Diversität)
  mutation_std: 0.02 # kalibrieren |
  # stress_mutation_boost: (Cirz 2007, Ubeda 2006).
  # Literatur-Korridor 10–100x; 30x liegt konservativ in der Mitte.
  stress_mutation_boost: 30.0 # geschätzt
  mutant_transfer_fraction: 0.03 # kalibriert | Anteil pro Mutation für neuen Mutantenstamm

  # --- Horizontaler Gentransfer ---
  base_hgt_rate: 0.02 # geschätzt | Darphorn, T. S., Sintanneland, B. B. K., Grootemaat, A. E., Van Der Wel, N. N., Brul, S., & Ter Kuile, B. H. (2022). Transfer dynamics of multi-resistance plasmids in Escherichia coli isolated from meat. PLoS ONE, 17(7), e0270205. https://doi.org/10.1371/journal.pone.0270205
  hgt_gene_transfer_prob: 0.25 # kalibrieren |

  # --- Selektion & Wachstum ---
  selection_strength: 0.6
  abx_selection_pressure_multiplier: 3.0
  antibiotic_kill_scale: 0.08 # kalibriert
  death_fitness_floor: 1.0 # kalibriert
  growth_rate_per_step: 1.5 # geschätzt | Wachstum: \(N_{next} = N \cdot e^{\text{growth} - \text{death}}\)
  death_rate_per_step: 0.01 # geschätzt
  strain_prune_threshold: 200.0 # technisch/kalibriert

  # --- Schaden, Lebenszyklus & Dormanz ---
  base_damage_per_step: 0.004 # kalibriert
  replication_damage_factor: 0.03 # kalibriert
  stress_damage_factor: 0.06 # kalibriert
  repair_rate_per_step: 0.08 # kalibriert
  age_mortality_scale: 0.001 # kalibrieren |
  damage_mortality_scale: 0.025 # kalibrieren |
  lifecycle_half_life_steps: 200.0 # kalibriert
  max_damage_load: 5.0 # technisch/kalibrieren |
  # Persister/Dormanz ist qualitativ belegt (PMC8865412); Koeffizient bleibt Modellannahme.
  dormancy_growth_penalty: 0.55 # geschätzt/kalibrieren |
  synergy_repair_dormancy_bonus: 0.25 # kalibrieren |
  synergy_stress_tolerance_bonus: 0.20 # kalibrieren |

  # --- Demografische Stochastik ---
  stochastic_threshold: 10000.0 # technisch/kalibriert
  stochastic_noise_scale: 0.08 # technisch/kalibriert
