run:
    days: 300
    seed: 42
    run_id: dev_run
    quiet: false

population:
    hospitals: 6
    susceptible_count: 300
    carrier_count: 40
    initial_department: ward
    susceptible_template:
        age_years: 50
        compliance: 0.8
        immune_strength: 1.0
        sociability: 1.0
        adherence: 1.0
        history_flags: []
    carrier_template:
        age_years: 50
        compliance: 0.8
        immune_strength: 1.0
        sociability: 1.0
        adherence: 1.0
        history_flags: []
        resistant_fraction: 0.90
        dominant_genotype: R2
        relative_transmissibility: 1.3
        p_clearance: 0.015
        severity_modifier: 1.0

macro:
    base_hygiene: 0.42
    base_isolation_effectiveness: 0.45
    base_diagnostic_speed: 0.55
    base_transmission_rate: 0.1
    daily_contact_attempts: 20.0
    icu_abx_probability: 0.85
    ward_abx_probability: 0.4
    carrier_isolation_probability: 0.25
    # LOS + Discharge
    los_mean_ward: 7.0
    los_mean_icu: 12.0
    los_sigma: 0.5
    carrier_extension_days: 9.0
    discharge_logistic_k: 1.25
    discharge_logistic_t_half: 1.5

    # Admissions (total per day across all hospitals; 0 = disabled)
    # Steady-state target for ~10k patients with effective LOS around 11 days: ~900/day
    daily_admission_rate: 900.0
    community_carrier_fraction: 0.08
    replacement_resistant_fraction: 0.90
    replacement_dominant_genotype: "R2"
    max_occupancy_per_hospital: 50

    # Grid (Feature 2; used once Mesa grids are integrated)
    dept_grid_cols: 3
    dept_grid_rows: 4
    dept_grid_icu_rows: 1
    network_grid_cols: 4
    proximity_decay_alpha: 0.5

micro:
    workers: 300
    founder_pool_size: 64
    founder_pool_seed: 1
    founder_pool_gene_noise_std: 0.03
    gene_presence_threshold: 0.2
    steps_per_day: 12
    max_strains: 100
    carrying_capacity: 1000000000.0
    min_population: 100.0  # extinction floor
    clearance_threshold: 12.0
    base_mutation_rate: 0.05
    mutation_std: 0.09
    stress_mutation_boost: 7.0
    base_hgt_rate: 0.08
    hgt_gene_transfer_prob: 0.6
    selection_strength: 1.45
    growth_rate_per_step: 0.36
    death_rate_per_step: 0.045
    strain_prune_threshold: 0.5
    base_damage_per_step: 0.008
    replication_damage_factor: 0.06
    stress_damage_factor: 0.07
    repair_rate_per_step: 0.12
    age_mortality_scale: 0.003
    damage_mortality_scale: 0.04
    lifecycle_half_life_steps: 110.0
    max_damage_load: 7.5
    dormancy_growth_penalty: 0.1
    synergy_repair_dormancy_bonus: 0.38
    synergy_stress_tolerance_bonus: 0.34
    stochastic_threshold: 40000.0
    stochastic_noise_scale: 0.65
